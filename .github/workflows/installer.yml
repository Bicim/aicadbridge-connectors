name: installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller (bootloader built from source)
        shell: bash
        run: |
          pip install pywin32
          # A self-compiled bootloader avoids the generic false positives that the
          # prebuilt PyInstaller bootloader sometimes triggers. Fall back to the wheel.
          PYINSTALLER_COMPILE_BOOTLOADER=1 pip install --no-binary pyinstaller "pyinstaller==6.16.0"             || pip install "pyinstaller==6.16.0"
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q tests/test_installer.py tests/test_desktop.py tests/test_bundle.py tests/test_version_info.py
      - name: Version resource
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          case "$VER" in v[0-9]*) ;; *) VER="$(python -c "import sys; sys.path.insert(0,'common'); import aicad_link; print(aicad_link.VERSION)")";; esac
          python tools/make_version_info.py "$VER" version_info.txt
      - name: Build AICADBridgeSetup.exe (onefile) and portable folder (onedir)
        shell: bash
        run: |
          COMMON=(--noconfirm --windowed --noupx --name AICADBridgeSetup
            --version-file version_info.txt --manifest installer/AICADBridgeSetup.manifest
            --paths common --paths desktop --hidden-import aicad_link --hidden-import aicadbridge_desktop
            --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes
            --exclude-module pythonwin --exclude-module win32ui --exclude-module win32uiole
            --exclude-module pywin --exclude-module dde --exclude-module unittest --exclude-module pydoc
            --exclude-module doctest --exclude-module difflib --exclude-module ftplib --exclude-module netrc
            --exclude-module csv --exclude-module tracemalloc --exclude-module statistics
            --exclude-module decimal --exclude-module bz2 --exclude-module lzma --exclude-module tarfile
            --add-data "fusion;fusion" --add-data "blender;blender"
            --add-data "desktop;desktop" --add-data "rhino;rhino" --add-data "common;common"
            --add-data "installer/logos;installer/logos")
          pyinstaller --onefile "${COMMON[@]}" installer/aicadbridge_setup.py
          # Onedir has no self-extracting stub, which is the usual trigger for heuristic AV hits.
          pyinstaller --onedir --distpath dist/onedir --workpath build/onedir "${COMMON[@]}" installer/aicadbridge_setup.py
          python -c "import shutil; shutil.make_archive('dist/AICADBridgeSetup-portable', 'zip', 'dist/onedir/AICADBridgeSetup')"
      - name: Build plugin zips
        run: python tools/bundle.py dist/plugins
      - name: Check zips carry the live server
        shell: python
        run: |
          import sys, zipfile
          from pathlib import Path
          names = ["AICADBridgeLink-fusion.zip", "aicadbridge_link-blender.zip", "AICADBridgeLink-desktop.zip",
                   "AICADBridgeLink-rhino.zip", "AICADBridgeLink-solidworks.zip"]
          for n in names:
              z = zipfile.ZipFile(Path("dist/plugins") / n)
              link = [m for m in z.namelist() if m.endswith("aicad_link.py")]
              if len(link) != 1 or b"aicad.92-5-107-17.sslip.io" not in z.read(link[0]):
                  sys.exit(f"{n}: aicad_link.py missing or wrong default server")
          print("ok")
      - name: SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum AICADBridgeSetup.exe AICADBridgeSetup-portable.zip plugins/*.zip | sed 's# plugins/# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AICADBridgeSetup
          path: |
            dist/AICADBridgeSetup.exe
            dist/AICADBridgeSetup-portable.zip
            dist/plugins/*.zip
            dist/SHA256SUMS.txt
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AICADBridgeSetup.exe
            dist/AICADBridgeSetup-portable.zip
            dist/SHA256SUMS.txt
            dist/plugins/AICADBridgeLink-fusion.zip
            dist/plugins/aicadbridge_link-blender.zip
            dist/plugins/AICADBridgeLink-desktop.zip
            dist/plugins/AICADBridgeLink-rhino.zip
            dist/plugins/AICADBridgeLink-solidworks.zip
