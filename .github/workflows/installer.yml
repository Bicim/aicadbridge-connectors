name: installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q tests/test_installer.py
      - name: Build AICADBridgeSetup.exe
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AICADBridgeSetup \
            --paths common --hidden-import aicad_link \
            --add-data "fusion;fusion" --add-data "blender;blender" \
            --add-data "solidworks;solidworks" --add-data "common;common" \
            installer/aicadbridge_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: AICADBridgeSetup
          path: dist/AICADBridgeSetup.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AICADBridgeSetup.exe
