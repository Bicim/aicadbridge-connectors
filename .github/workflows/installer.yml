name: installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pywin32
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q tests/test_installer.py tests/test_desktop.py tests/test_bundle.py
      - name: Build AICADBridgeSetup.exe
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AICADBridgeSetup \
            --paths common --paths desktop --hidden-import aicad_link --hidden-import aicadbridge_desktop \
            --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes             --exclude-module pythonwin --exclude-module win32ui --exclude-module win32uiole             --exclude-module pywin --exclude-module dde --exclude-module unittest --exclude-module pydoc             --exclude-module doctest --exclude-module difflib --exclude-module ftplib --exclude-module netrc             --exclude-module csv --exclude-module tracemalloc --exclude-module statistics             --exclude-module decimal --exclude-module bz2 --exclude-module lzma --exclude-module tarfile \
            --add-data "fusion;fusion" --add-data "blender;blender" \
            --add-data "desktop;desktop" --add-data "rhino;rhino" --add-data "common;common" \
            installer/aicadbridge_setup.py
      - name: Build plugin zips
        run: python tools/bundle.py dist/plugins
      - name: Check zips carry the live server
        shell: python
        run: |
          import sys, zipfile
          from pathlib import Path
          names = ["AICADBridgeLink-fusion.zip", "aicadbridge_link-blender.zip", "AICADBridgeLink-desktop.zip",
                   "AICADBridgeLink-rhino.zip", "AICADBridgeLink-solidworks.zip"]
          for n in names:
              z = zipfile.ZipFile(Path("dist/plugins") / n)
              link = [m for m in z.namelist() if m.endswith("aicad_link.py")]
              if len(link) != 1 or b"aicad.92-5-107-17.sslip.io" not in z.read(link[0]):
                  sys.exit(f"{n}: aicad_link.py missing or wrong default server")
          print("ok")
      - uses: actions/upload-artifact@v4
        with:
          name: AICADBridgeSetup
          path: |
            dist/AICADBridgeSetup.exe
            dist/plugins/*.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AICADBridgeSetup.exe
            dist/plugins/AICADBridgeLink-fusion.zip
            dist/plugins/aicadbridge_link-blender.zip
            dist/plugins/AICADBridgeLink-desktop.zip
            dist/plugins/AICADBridgeLink-rhino.zip
            dist/plugins/AICADBridgeLink-solidworks.zip
